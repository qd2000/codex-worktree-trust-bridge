name: Release acceptance gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# A development branch must not overwrite an existing release or turn a
# source-only archive into an alleged accepted multi-host binary artifact.
permissions:
  contents: read

jobs:
  acceptance-required:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Refuse publication until the accepted-artifact flow is implemented
        shell: pwsh
        run: |
          $status = Get-Content -LiteralPath RELEASE_STATUS.json -Raw | ConvertFrom-Json
          Write-Output "Target $($status.targetVersion), state $($status.state)"
          throw 'V022_RELEASE_NOT_ACCEPTED: implement and verify publication of the single accepted binary artifact after all frozen gates pass. Existing releases must never be overwritten.'
